name: Update English Club event

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-english-club-event
  cancel-in-progress: false

jobs:
  refresh-event:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/english-club

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/english-club/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read latest Telegram announcement
        run: node scripts/update-telegram-event.mjs

      - name: Build website
        run: npm run build

      - name: Publish updated event data
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/english-club/source/public/data/latest-event.json examples/english-club/dist
          if git diff --cached --quiet; then
            echo "The published announcement is already current."
            exit 0
          fi
          git commit -m "Update English club event"
          git push
